# MaintMode — self-hosted Docker Compose stack.
#
# Six services: postgres, valkey, a one-shot migration job, the Go backend, the
# Next.js frontend, and a small Caddy gateway in front of the two. Everything a
# working instance needs, nothing else.
#
#   docker compose up -d
#
# Read README.md first — this file will not produce a usable instance without
# a filled-in .env and config/app.secrets.yaml.
#
# THE GATEWAY
#
# The browser talks to the frontend for everything except Google sign-in: that
# is an OAuth dance run by the backend, so the browser must reach two backend
# routes (/start and /callback). The gateway (gateway/Caddyfile) gives both one
# origin — those two routes go to the backend with the /auth prefix stripped,
# everything else goes to the frontend — and exposes nothing else of the
# backend. It is the only published port. It does not terminate TLS; put your
# own reverse proxy in front for that (README, "Behind a reverse proxy with
# TLS").
#
# WHAT IS DELIBERATELY ABSENT
#
# The upstream development stack also runs a connection pooler and a full
# monitoring stack (VictoriaMetrics, Grafana, Loki, Tempo, Pyroscope). Neither
# is here:
#
#   - pg_doorman (pooler): the backend opens at most `max_open_conns` (50)
#     connections and Postgres defaults to 100. A pooler solves a problem a
#     single-instance deployment does not have, at the cost of one more moving
#     part to operate and debug. The app talks to Postgres directly.
#   - monitoring: valuable, but it roughly triples the RAM footprint and has
#     nothing to do with getting MaintMode running.
#
# The frontend server talks to the backend directly on port 8000, not through
# the gateway. Upstream, Caddy's `handle_path` STRIPS the /auth and /maintmode
# prefixes before proxying, so http://caddy:3000/auth/api/v1/me and
# http://maintmode:8000/api/v1/me are the same route. Both frontend API base
# URLs therefore point at the same origin here.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: maintmode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — see .env.example}
      POSTGRES_DB: maintmode
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - data
    # No published port. Nothing outside this compose network needs to reach
    # Postgres, and an exposed 5432 is the single most-scanned port on the
    # internet. To connect a client, use `docker compose exec postgres psql`
    # (see the backup section of the README) or add a 127.0.0.1-bound mapping.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintmode -d maintmode"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  valkey:
    image: valkey/valkey:9.1.1-alpine
    restart: unless-stopped
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required — see .env.example}
    # Valkey holds sign-in state as well as rate-limit counters and locks, so
    # it requires a password even on the private `data` network.
    #
    # The password goes into a config file rather than onto the command line:
    # process arguments are readable by every user on a Linux host (`ps`). The
    # file is written as root, handed to the valkey user, and the image's own
    # entrypoint then drops privileges as usual. appendonly makes the AOF
    # durable across restarts — losing the counters is survivable, but a cold
    # start after every restart is needless churn.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        printf 'requirepass "%s"\n' "$$VALKEY_PASSWORD" > /tmp/auth.conf
        chown valkey:valkey /tmp/auth.conf
        exec docker-entrypoint.sh valkey-server /tmp/auth.conf --appendonly yes
    volumes:
      - valkey_data:/data
    networks:
      - data
    healthcheck:
      # A bare `ping` exits 0 even when refused with NOAUTH, so look for PONG.
      test: ["CMD-SHELL", "VALKEYCLI_AUTH=\"$$VALKEY_PASSWORD\" valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # One-shot schema migration. Runs to completion, then exits 0; the backend
  # waits on that exit via `service_completed_successfully`, so the app never
  # starts against a half-migrated schema.
  #
  # This image is NOT a generic goose runner — it carries MaintMode's migration
  # files inside itself. Keep its tag in lockstep with the maintmode tag below:
  # a backend newer than its schema fails in ways that are tedious to diagnose.
  migrations:
    image: ghcr.io/maintmode-dev/maintmode-migrations:${MAINTMODE_VERSION:-main}
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://maintmode:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/maintmode?sslmode=disable
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    # Not `unless-stopped`: this is a job, not a service. `on-failure` retries a
    # migration that lost a race with a not-quite-ready Postgres, but a job that
    # succeeded stays exited instead of looping forever.
    restart: on-failure

  # The Go backend. One binary serves both the auth routes and the application
  # API: 8000 is the public API, 8001 is the infra port (health, readiness).
  maintmode:
    image: ghcr.io/maintmode-dev/maintmode:${MAINTMODE_VERSION:-main}
    restart: unless-stopped
    environment:
      MAINTMODE_CONFIG_DIR: /app
      MAINTMODE_AUTHZ_DIR: /app/authz
    volumes:
      # Non-secret settings. Read-only: the app never writes them, and a
      # read-only mount means a container compromise cannot rewrite its own
      # config.
      - ./config/app.config.yaml:/app/app.config.yaml:ro
      # Secrets, resolved into the config above wherever it says <secret:...>.
      # This file is gitignored and you create it yourself — see the README.
      # The container runs as an unprivileged user, so both files must be
      # world-readable on the host (chmod 644) or startup fails on a read error.
      - ./config/app.secrets.yaml:/app/app.secrets.yaml:ro
      # The RBAC model and policy ship inside the image at /app/authz. Mount
      # your own only if you are deliberately customising the role matrix.
    # The only service on all three networks: `data` for Postgres and Valkey,
    # `app` for the frontend and the gateway, and `edge` for its outbound
    # calls — Google sign-in, Slack, Telegram, SMTP.
    networks:
      - edge
      - app
      - data
    # No published ports. The frontend reaches the backend over the compose
    # network, and the browser reaches only the two sign-in routes the gateway
    # lets through. Publishing 8000 would expose the whole API, break-glass
    # sign-in included, with nothing in front of it.
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      # /readiness on the infra port reports 200 only once the DB and Valkey
      # are actually reachable, so this gates the frontend on a backend that
      # can serve, not merely one whose process has started.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # The Next.js frontend, which is also the BFF: the browser never holds a
  # backend token, and never talks to the backend directly — except the two
  # sign-in routes, through the gateway.
  ui:
    image: ghcr.io/maintmode-dev/maintmode-ui:${MAINTMODE_UI_VERSION:-main}
    restart: unless-stopped
    environment:
      # Server-to-server. Both point at the same origin: without prefix
      # stripping there is no /auth vs /maintmode split (see the header comment).
      MAINTMODE_API_BASE_URL: http://maintmode:8000
      MAINTMODE_AUTH_API_BASE_URL: http://maintmode:8000
      MAINTMODE_API_TIMEOUT_MS: ${MAINTMODE_API_TIMEOUT_MS:-10000}
      # These three are validated when the auth module loads — that is, before
      # any route renders. Miss one and NOTHING serves, including /login. The
      # `:?` guards turn that runtime crash into an upfront compose error that
      # names the variable.
      MAINTMODE_AUTH_SECRET: ${MAINTMODE_AUTH_SECRET:?MAINTMODE_AUTH_SECRET is required, min 32 chars — see .env.example}
      MAINTMODE_APP_BASE_URL: ${MAINTMODE_APP_BASE_URL:?MAINTMODE_APP_BASE_URL is required — the public URL users type}
      # Where the BROWSER is sent to start Google sign-in: the public URL plus
      # the gateway's /auth prefix. Derived, so it cannot drift from the above.
      MAINTMODE_AUTH_PUBLIC_BASE_URL: ${MAINTMODE_APP_BASE_URL}/auth
      # The public origin for Auth.js. Without it the frontend derives its URLs
      # from X-Forwarded-* headers, which the gateway does not pass through
      # (gateway/Caddyfile), or from its own bind address.
      AUTH_URL: ${MAINTMODE_APP_BASE_URL}
    # No published ports: the gateway is the way in. Only on `app`: the
    # frontend talks to nothing but the backend, so it has no route to the
    # database, to Valkey, or out to the internet.
    networks:
      - app
    depends_on:
      maintmode:
        condition: service_healthy
    # Without this, a present-but-invalid auth variable (a secret under 32
    # characters, a URL without its scheme — the `:?` guards above only catch
    # MISSING ones) left the container "running" while every page answered
    # 500. /login is the probe because it loads the auth module, so an invalid
    # value fails it, but it does NOT need the backend: an unreachable backend
    # gives the break-glass sign-in form and a 200 within its 2-second
    # provider timeout. So "unhealthy" here means the frontend's own config,
    # never a backend outage — that one is the maintmode service's healthcheck.
    #
    # `node` because the image has no curl or wget. `redirect: manual`, so a
    # redirect is not followed into some other page's 200.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login',{redirect:'manual',signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.status===200?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # The single entry point: the frontend, plus the backend's two sign-in routes.
  # Configuration and the reasoning live in gateway/Caddyfile. The stock image
  # is enough — the gateway only routes; it does not rate-limit or do TLS.
  gateway:
    image: caddy:2.11-alpine
    restart: unless-stopped
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      # Bound to 127.0.0.1 by default so a fresh `up` does not put an instance
      # on the public internet before you have set it up (see README, "First
      # login"). Leave it and front the stack with a reverse proxy on the same
      # host, or set MAINTMODE_BIND_ADDRESS=0.0.0.0 in .env.
      - "${MAINTMODE_BIND_ADDRESS:-127.0.0.1}:${MAINTMODE_HTTP_PORT:-3000}:3000"
    # `edge` carries the published port (an internal network cannot publish
    # one); `app` reaches the frontend and the backend's sign-in routes.
    networks:
      - edge
      - app
    # Healthy, not merely started: with a broken frontend `docker compose up`
    # stops here and names the unhealthy container, instead of publishing a
    # port that answers 500 to everything.
    depends_on:
      ui:
        condition: service_healthy

networks:
  # Three networks, so that a compromised container reaches only what it
  # needs. `app` and `data` are internal: no route out of the host, and nothing
  # on them is reachable from outside.
  #
  #   edge  gateway (published port), maintmode (outbound calls)
  #   app   gateway, ui, maintmode
  #   data  maintmode, migrations, postgres, valkey
  #
  # In particular the frontend — the container that parses every browser
  # request — cannot reach Postgres or Valkey.
  edge:
  app:
    internal: true
  data:
    internal: true

volumes:
  # Named volumes, not bind mounts: `docker compose down` (without -v) leaves
  # them intact, and they are what the backup commands in the README operate on.
  db_data:
  valkey_data:
