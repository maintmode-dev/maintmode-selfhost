# MaintMode backend — secrets (example).
#
#   cp config/app.secrets.example.yaml config/app.secrets.yaml
#
# Then replace every REPLACE_ME below. app.secrets.yaml is gitignored; this
# example is not, so never put a real value in this file.
#
# A flat key -> value map. Wherever app.config.yaml says <secret:db/dsn>, the
# value of the `db/dsn` key here is substituted at startup. A missing key is a
# hard startup failure, not a silent empty string.
#
# The container runs as an unprivileged user and mounts this file read-only, so
# it must be readable by others:
#
#   chmod 644 config/app.secrets.yaml
#
# Every value here is a live credential. Back this file up somewhere your
# database dumps are not — see README.md, "Backup and restore".

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
#
# The password must be the SAME value as POSTGRES_PASSWORD in .env. `postgres`
# is the hostname of the container on the compose network, not your machine.
# sslmode=disable is correct here: the connection never leaves the Docker
# network. Point this elsewhere and you should require TLS.
db/dsn: "postgres://maintmode:REPLACE_ME_SAME_AS_POSTGRES_PASSWORD@postgres:5432/maintmode?sslmode=disable"

# Valkey runs without authentication on the private compose network and is not
# published to the host. Leave this empty unless you have configured a password.
valkey/password: ""

# ---------------------------------------------------------------------------
# Google OAuth
# ---------------------------------------------------------------------------
#
# The client ID ONLY. There is deliberately no client secret here: the frontend
# owns the code exchange with Google and holds the only copy of the secret. The
# backend just verifies the resulting ID token offline, using this as the
# expected audience.
#
# Must be byte-for-byte the same as MAINTMODE_GOOGLE_OAUTH_CLIENT_ID in .env,
# or every login fails audience validation with an opaque error.
oauth/google/client_id: "REPLACE_ME.apps.googleusercontent.com"

# ---------------------------------------------------------------------------
# Token signing
# ---------------------------------------------------------------------------
#
# The signing key is a raw 32-byte P-256 scalar, hex-encoded (64 hex chars).
# Generate it with:
#
#   openssl rand -hex 32
#
# Do NOT use `openssl ecparam -genkey ... | xxd` — that emits a full DER
# structure, not a raw scalar, and startup rejects it. Startup also rejects a
# key that is all one repeated byte, so placeholders fail loudly rather than
# shipping a guessable signing key.
#
# Rotating this key invalidates every issued token and logs everyone out.
jwt/issuer_private_key: "REPLACE_ME_64_HEX_CHARS"

# Key ID advertised in the instance's JWKS. Any stable identifier works; a
# random hex string is conventional. Generate with:
#
#   openssl rand -hex 16
jwt/issuer_kid: "REPLACE_ME_32_HEX_CHARS"

# ---------------------------------------------------------------------------
# Encryption at rest
# ---------------------------------------------------------------------------
#
# Master key wrapping the data keys that encrypt integration secrets (Slack
# tokens, SMTP passwords) stored in the database. 32 bytes, hex-encoded:
#
#   openssl rand -hex 32
#
# LOSE THIS AND EVERY STORED INTEGRATION SECRET IS UNRECOVERABLE. A database
# restore without the matching key leaves integrations configured but unusable
# until you re-enter their credentials. The key ID must match `active_kek_uri`
# in app.config.yaml.
crypto/kek/selfhost-1: "REPLACE_ME_64_HEX_CHARS"
