# MaintMode backend — non-secret configuration.
#
# Mounted read-only at /app/app.config.yaml. Values written as <secret:key> are
# resolved from app.secrets.yaml at startup, so no credential ever appears in
# this file and it is safe to commit alongside your own infrastructure.
#
# Sensible defaults for a self-hosted single-instance deployment. You can run
# it unchanged; the sections worth revisiting are marked.
#
# NOTE: there is deliberately no `license:` block. The seat-based licence gate
# activates only when BOTH a console URL and an instance token are set. Neither
# is set here, so no heartbeat runs, no seat cap applies, and nothing leaves
# your network. See README.md, "Licensing and telemetry".

environment: prod

app:
  # Where the backend sends a browser back at the end of Google sign-in. Must
  # match MAINTMODE_APP_BASE_URL in .env — a mismatch redirects users into
  # nowhere after an otherwise successful login.
  frontend_url: http://localhost:9000
  # The frontend page that finishes Google sign-in, appended to frontend_url.
  # Fixed by the frontend; do not change it.
  oauth_callback_path: /auth/oauth/callback
  # The Path of the two short-lived sign-in cookies. It must be the EXTERNAL
  # prefix the browser sees: the gateway strips /auth before the backend sees
  # the request, but the browser only sends a cookie back to the path it was set
  # for. Do not change it.
  oauth_cookie_path: /auth/api/v1/login/oauth

auth:
  # Invite-only. An unknown user with no invitation is rejected — on a fresh
  # instance too. The first administrator signs in with the break-glass password
  # (`bootstrap` at the bottom of this file) and invites everyone else. See
  # README.md, "First login".
  #
  # Setting this to true lets anyone who can sign in through an enabled
  # provider (Google, GitHub, ...) create an account on your instance, with the
  # guest role. Only do that if you front it with something that already
  # restricts who can reach it, or restrict Google to your Workspace domains
  # (`allowed_hosted_domains` under the google provider below).
  allow_open_signup: false

jwtverifier:
  # The backend both mints and verifies its own tokens, checking them against
  # the public half of jwt.issuer_private_key in-process: nothing is fetched.
  # Must equal jwt.issuer_name: tokens are minted with that issuer and
  # verified against this one, so a mismatch rejects every sign-in.
  jwt_issuer: oauth-service
  jwt_leeway: 30s

rbac:
  # The role matrix ships inside the image at /app/authz (MAINTMODE_AUTHZ_DIR).
  # Filenames are relative to that directory.
  adapter: file
  model: model.conf
  policy: policy.csv

logger:
  # `debug` is useful while diagnosing a failed bring-up, but it logs request
  # detail you probably do not want retained. Put it back to info afterwards.
  level: info

api_server:
  name: api
  host: 0.0.0.0
  port: 8000
  # Cap on the login surface, per client: keyed on the address that connected
  # to the gateway. Behind your own proxy that address is the proxy's — one
  # bucket for everyone — unless gateway/Caddyfile trusts the proxy's address.
  rate_limiter:
    requests_per_minute: 30
    burst: 30
    expires_in: 3m
    timeout: 200ms
  # Cap on the screen-data routes, keyed by user id rather than IP: a team
  # behind one office NAT shares an address, and an IP key would let one
  # person's runaway tab throttle their colleagues.
  ui_rate_limiter:
    requests_per_minute: 300
    burst: 300
    expires_in: 3m
    timeout: 200ms
  # Socket deadlines. These are connection hygiene (slowloris, half-open
  # sockets), not per-request budgets. Omitting a key does not disable the
  # deadline — it falls back to the same default.
  timeouts:
    read_header: 10s
    read: 30s
    write: 30s
    idle: 75s

infra_server:
  # Health, readiness, and pprof. Never publish this port.
  name: status
  host: 0.0.0.0
  port: 8001
  # No write deadline on purpose: a CPU profile blocks for its whole sampling
  # window before the body completes, and a fixed deadline would truncate it.
  timeouts:
    read_header: 10s
    read: 30s
    idle: 75s

# On SIGTERM the process reports not-ready and keeps serving for this long
# before closing its listener, so a proxy in front can drain it first.
shutdown:
  drain_timeout: 6s

db:
  dsn: <secret:db/dsn>
  driver: postgres
  # Postgres defaults to 100 connections; 50 leaves room for psql and backups.
  max_open_conns: 50
  max_idle_conns: 20
  connection_max_lifetime: 10m
  connection_max_idle_time: 5m

valkey:
  addr: valkey:6379
  password: <secret:valkey/password>
  db: 0

oauth_providers:
  # Login providers. The backend runs the OAuth exchange itself as a
  # confidential client, so it needs the client ID, the client secret, and the
  # redirect URI you registered with Google. See README.md, "Set up Google
  # OAuth".
  #
  # managed_by: config means the provider is declared here: read-only in the
  # admin UI, changes apply on restart, and the secret is a <secret:...>
  # reference into app.secrets.yaml, never a literal. To manage Google from the
  # admin UI instead, replace everything below `issuer_url` with
  # `managed_by: ui` and drop its secret from app.secrets.yaml.
  providers:
    google:
      display_name: Google
      issuer_url: https://accounts.google.com
      managed_by: config
      enabled: true
      # The Client ID from Google Cloud Console. Not a secret.
      client_id: "REPLACE_ME.apps.googleusercontent.com"
      # The EXTERNAL URL Google sends the browser back to: your public URL, then
      # /auth/api/v1/login/oauth/google/callback. Must be registered in Google
      # byte for byte. A mismatch fails on Google's side with
      # redirect_uri_mismatch and never reaches the backend logs.
      redirect_uri: "http://localhost:9000/auth/api/v1/login/oauth/google/callback"
      client_secret: <secret:auth_provider/google/client_secret>
      # Optional: admit only Google Workspace accounts from these domains (the
      # `hd` claim). Empty or absent admits any Google account that has an
      # invitation — or any at all, with allow_open_signup: true.
      # jwtverifier:
      #   allowed_hosted_domains: ["example.com"]
    # GitHub sign-in, managed from the admin UI (Administration →
    # Authentication). This entry holds only GitHub's endpoints: the admin UI
    # refuses to create a provider this file does not list, so without it
    # GitHub could not be added at all. It stays off until an admin enters a
    # GitHub OAuth app's client ID and secret, with the callback URL
    # <your public URL>/auth/api/v1/login/oauth/github/callback.
    github:
      display_name: GitHub
      authorize_url: https://github.com/login/oauth/authorize
      token_url: https://github.com/login/oauth/access_token
      api_base_url: https://api.github.com
      managed_by: ui
    # Your own OpenID Connect provider (Keycloak, Authentik, Okta, Azure AD,
    # ...). `custom` ships no defaults, so this entry carries everything. Off
    # until you fill it in and set enabled: true; the issuer must publish
    # /.well-known/openid-configuration. Register the callback URL
    # <your public URL>/auth/api/v1/login/oauth/custom/callback with the
    # provider, as redirect_uri below. The client secret goes into
    # app.secrets.yaml under auth_provider/custom/client_secret; that key must
    # exist even while this provider is off.
    custom:
      display_name: "Corporate SSO"
      issuer_url: "https://sso.example.com/realms/maintmode"
      managed_by: config
      enabled: false
      client_id: "REPLACE_ME"
      redirect_uri: "http://localhost:3000/auth/api/v1/login/oauth/custom/callback"
      client_secret: <secret:auth_provider/custom/client_secret>

jwt:
  issuer_name: oauth-service
  issuer_private_key: <secret:jwt/issuer_private_key>
  issuer_kid: <secret:jwt/issuer_kid>
  access_token_ttl: 15m
  refresh_token_ttl: 720h # 30 days
  # Signed out after this long without activity, and after this long from
  # sign-in whatever the activity.
  session_inactive_lifetime: 168h # 7 days
  session_max_lifetime: 720h # 30 days
  refresh_token_grace_period: 30s
  refresh_token_distributed_lock_ttl: 5s

notify_transport:
  # Slack, Telegram, and SMTP are set up from the admin UI after you log in
  # (Administration → Integrations): their credentials live encrypted in the
  # database, and changing them needs no redeploy. That is what a transport
  # with no section under `transports:` gets, which is all of them here.
  #
  # To keep a transport's credentials in your own secret store instead,
  # declare it under `transports:` (slack, telegram, email) with
  # `managed_by: config`, `enabled`, and its settings; its secret (bot_token,
  # or password for email) must be a <secret:...> reference into
  # app.secrets.yaml. It is then read-only in the admin UI and changes apply on
  # restart. Declaring a transport an admin already configured takes it over
  # and wipes the credential stored in the database.
  use_stub: false
  # Slack, Telegram and SMTP refuse loopback, private and other internal
  # addresses by default: an admin types the Slack/Telegram API URL and the SMTP
  # host, so without this guard those fields reach anything this server can
  # reach. If your SMTP relay lives on your internal network (10.x, 192.168.x,
  # a hostname resolving there), uncomment this and run
  # `docker compose restart maintmode` (`up -d` does not reread this file).
  # Needs a backend that knows the key — an older one refuses to start on it.
  # allow_internal_hosts: true

task_processor:
  messaging:
    workers: 10
    max_attempts: 5
  # Cron fields are "minute hour day-of-month month day-of-week", evaluated in
  # UTC whatever the host's time zone. Every cron_spec is required: an empty or
  # malformed one fails startup.
  #
  # Cancels a maintenance that has not started `threshold` after its planned
  # start.
  maint_auto_cancel:
    cron_spec: "* * * * *"
    threshold: 15m
    batch_limit: 100
  audit_prune:
    # Daily at 03:00 UTC. Audit rows older than the retention are deleted in
    # batches — raise it if you have a compliance requirement.
    cron_spec: "0 3 * * *"
    retention: 8760h # 365 days
    batch_limit: 1000
  invitation_rotate:
    cron_spec: "0 3 * * *"
    batch_limit: 1000
  invitation_prune:
    cron_spec: "0 3 * * *"
    retention: 8760h # 365 days
    batch_limit: 1000
  # Deletes spent sign-in codes.
  otp_prune:
    cron_spec: "15 3 * * *"
    retention: 24h
    batch_limit: 1000

# Master key wrapping the data keys that encrypt integration secrets (your
# Slack token, SMTP password, ...) at rest in the database.
#
# LOSING THIS KEY MAKES EVERY STORED INTEGRATION SECRET UNREADABLE. Back it up
# with your secrets file, not only with your database dump — a restored dump
# without the matching key leaves your integrations configured but unusable.
#
# Retired keys must stay listed under local_keys so already-wrapped data keys
# can still be unwrapped during a rotation.
crypto:
  active_kek_uri: local-kms://selfhost-1
  local_keys:
    "local-kms://selfhost-1": <secret:crypto/kek/selfhost-1>

# Break-glass sign-in: the administrator account behind the password alone, at
# /login/recovery. It is how the first administrator gets in on a fresh
# instance, and the way back in if every other sign-in method breaks.
#
# The password lives in app.secrets.yaml under `bootstrap/password`. An empty
# value means this instance has no break-glass — and then a fresh instance has
# no way to create its first administrator. The key must exist either way.
bootstrap:
  password: <secret:bootstrap/password>
